<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Example</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            margin: 10px;
            padding: 20px;
           
        }

        .item {
            flex-shrink: 1;
            flex-basis: 150px;
            margin: 10px;
            padding: 20px;
            img {
                width: 185px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item"><img src="img1.png" alt="le"></div>
        <div class="item"><img src="img2.png" alt="le"></div>
        <div class="item"><img src="img3.png" alt="le"></div>
    </div>

</body>

</html>
