<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 4</title>
    <link rel="stylesheet" href="styles.css">
</head>

<style>

    body {
         color: aliceblue;
          text-align: center;
          background-image: url(https://media.istockphoto.com/id/1407063872/uk/%D0%B2%D0%B5%D0%BA%D1%82%D0%BE%D1%80%D0%BD%D1%96-%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%BD%D1%8F/%D1%81%D1%83%D1%87%D0%B0%D1%81%D0%BD%D0%B8%D0%B9-%D0%B0%D0%B1%D1%81%D1%82%D1%80%D0%B0%D0%BA%D1%82%D0%BD%D0%B8%D0%B9-%D1%84%D0%BE%D0%BD-%D0%B7-%D1%87%D0%BE%D1%80%D0%BD%D0%B8%D0%BC-%D0%B3%D1%80%D0%B0%D0%B4%D1%96%D1%94%D0%BD%D1%82%D0%BE%D0%BC-%D0%B0%D0%B1%D1%81%D1%82%D1%80%D0%B0%D0%BA%D1%82%D0%BD%D0%B8%D0%B9-%D1%87%D0%BE%D1%80%D0%BD%D0%B8%D0%B9-%D1%84%D0%BE%D0%BD-%D0%B1%D1%96%D0%B7%D0%BD%D0%B5%D1%81%D1%83.jpg?s=612x612&w=0&k=20&c=4qBAcN85jsMwo_zmo9B6LrhfaS8idGSkBXKnWpyj8X4=);
         background-position: center;
         background-size: cover;
         background-attachment: fixed;
        }        

    ul, a {
        text-decoration: none;
         a:hover {
          text-decoration: underline;
         }
    }

    .Forms {
        max-width: 400px;
        column-count: 1;
        gap: 15px;
        flex: 1;
        background-color: rgb(50, 50, 50);
        color: rgb(255, 255, 255);
        text-align: center;
    }

    .Forms,
    input {
        margin-bottom: 10px;
    }
    
</style>

<body>
    <main>
        <header>
            <h1 class="text-">STUDENT CARD</h1>
            <section class="Forms">
                <form action="." method="post">
                    <h2>Personal Information</h2>
                    <fieldset class="Forms">
                        <legend>Provide your details</legend>
                        <p></p>
                        <label for="name">Ім'я:</label>
                        <input type="text" id="name" name="name" required>
                        <p></p>
                        <label for="email">Пошта:</label>
                        <input type="email" id="email" name="email" required>
                        <p></p>
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required>
                        <p></p>
                        <label for="age">Вік:</label>
                        <input type="number" id="age" name="age" min="1" max="120" required>
                        <p></p>
                        <label for="birthdate">Дата народження:</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                        <p></p>
                        <label><input type="radio" name="gender" value="male" required> Чоловік</label>
                        <label><input type="radio" name=">gender" value="female" required> Жінка</label>
                        <p></p>
                        <label for="language">Мова:</label>
                        <select id="language" name="language" required>
                            <option value="uk">Українська</option>
                            <option value="en">Англійська</option>
                            <option value="de">Німецька</option>
                        </select>
                        <p></p>
                        <label for="country">Країна</label>
                        <select for="country" required>
                            <option value="uk">Україна</option>
                            <option value="en">Англія</option>
                            <option value="de">Німеччина</option>
                        </select>
                        <p></p>
                    </fieldset>

                    <h2>College Subject</h2>
                    <fieldset>
                        <legend>Вибери свій предмет</legend>
                        <label for="country">Предмети на вибір</label>
                        <select for="country" required>
                            <option value="mate">Математика</option>
                            <option value="uklangueg">Українська мова</option>
                            <option value="english">Англійська</option>
                            </select>
                            <p></p>
                            <label for="range">Rate Interest in Computer Science</label>
                            <input type="range" required>
                    </fieldset>
                    <h2>Your Skill</h2>
                    <fieldset>
                        <legend>Assess your skills</legend>
                        <legend><label for="desc">Опишіт ваші скіли</label></legend>
                        <textarea></textarea>
                        <p></p>
                        <label for="file">Файл:</label>
                        <input type="file" id="file" name="file" required>
                        <p></p>
                        <label for="color">Колір:</label>
                        <input type="color" id="color" name="color" value="#000000" required>
                        <p></p>
                        <label for="time">Time</label>
                        <input type="time" id="time" name="time" required>
                        <p></p>
                    </fieldset>
                     <button type="submit">Відправити</button>
                </form>
            </section>
    </main>

    <aside>
        <h4>Головна сторінка</h4>
        <ul>
            <a href="https://rrevura2023-ux.github.io/mt41_iplbrrr/">Цикни на мене!</a>
        </ul>
    </aside>

    <footer>



        <p>&copy; 2026 Всі права захищені</p>
    </footer>
</body>

</html>
