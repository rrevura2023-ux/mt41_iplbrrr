<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 4</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<style>
    body {
        color: rgb(82, 63, 134);
        text-align: center;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQs2I1TjuMAOswnJSbQp1OrQmH8ODbEkuLik5x9VihHz1aCnmmTWC_b0Y7f&s=10);
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
    }

    ul,
    a {
        text-decoration: none;

        a:hover {
            text-decoration: underline;
        }
    }

    .Forms {
        max-width: 400px;
        column-count: 1;
        gap: 15px;
        flex: 1;
        background-image: url(https://img.magnific.com/premium-photo/abstract-blue-background-texture-graphic-design-web-design-banner_947073-8965.jpg?semt=ais_hybrid&w=740&q=80);
        text-align: center;
        background-attachment: fixed;
        background-position: center;
        font-family: "", sans-serif;
        font-size: medium;
    }

    h2 {
        color: #1d3086;
        font-family: 'Oswald', sans-serif;
        text-decoration: none;
    }

    label {
        color: rgb(82, 72, 137);
        font-family: 'Roboto Slab', sans-serif;
    }

    label:hover {
        text-decoration: underline;
        color: rgb(81, 52, 124);
        transition: 2s;
        text-decoration-color: rgb(207, 228, 251);
    }

    .Forms,
    select,
    input,
    textarea {
        margin-bottom: 10px;
        background-color: rgb(37, 44, 121);
        border-radius: 10px;
        border-color: rgb(148, 148, 202);
    }

    legend {
        color: rgb(48, 11, 128);
    }

    button {

        background-color: black;
        color: rgb(84, 84, 122);
        border-radius: 10px;
        border-color: blue;
    }

    section, fieldset {
        border-color:rgb(39, 21, 97);
        border-radius: 10px;
    }
</style>

<body>
    <main>
        <header>
            <h1 class="text-"><strong>STUDENT CARD</strong></h1>
            <section class="Forms">
                <form action="." method="post">
                    <h2></strong>Personal Information</strong></h2>
                    <fieldset>
                        <legend><strong>Provide your details</strong></legend>
                        <p></p>
                        <label for="name">Ім'я:</label>
                        <input type="text" id="name" name="name" required>
                        <p></p>
                        <label for="email">Пошта:</label>
                        <input type="email" id="email" name="email" required>
                        <p></p>
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required>
                        <p></p>
                        <label for="age">Вік:</label>
                        <input type="number" id="age" name="age" min="1" max="120" required>
                        <p></p>
                        <label for="birthdate">Дата народження:</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                        <p></p>
                        <label><input type="radio" name="gender" value="male" required> Чоловік</label>
                        <label><input type="radio" name=">gender" value="female" required> Жінка</label>
                        <p></p>
                        <label for="language">Мова:</label>
                        <select id="language" name="language" required>
                            <option value="uk">Українська</option>
                            <option value="en">Англійська</option>
                            <option value="de">Німецька</option>
                        </select>
                        <p></p>
                        <label for="country">Країна</label>
                        <select for="country" required>
                            <option value="uk">Україна</option>
                            <option value="en">Англія</option>
                            <option value="de">Німеччина</option>
                        </select>
                        <p></p>
                    </fieldset>

                    <h2><strong>College Subject</strong></h2>
                    <fieldset>
                        <legend><strong>Вибери свій предмет</strong></legend>
                        <label for="country">Предмети на вибір</label>
                        <select for="country" required>
                            <option value="mate">Математика</option>
                            <option value="uklangueg">Українська мова</option>
                            <option value="english">Англійська</option>
                        </select>
                        <p></p>
                        <label for="range">Rate Interest in Computer Science</label>
                        <input type="range" required>
                    </fieldset>
                </form>
                <form action="." method="post">
                    <h2><strong>Skill</strong></h2>
                    <fieldset>
                        <legend><strong>Assess your skills</strong></legend>
                        <legend><label for="desc">Опишіт ваші скіли</label></legend>
                        <textarea></textarea>
                        <p></p>
                        <label for="file">Файл:</label>
                        <input type="file" id="file" name="file" required>
                        <p></p>
                        <label for="color">Колір:</label>
                        <input type="color" id="color" name="color" value="#000000" required>
                        <p></p>
                        <label for="time">Time</label>
                        <input type="time" id="time" name="time" required>
                        <p></p>
                    </fieldset>
                    <button type="submit"><strong>Відправити</strong></button>
                </form>
            </section>
    </main>

    <aside>
        <h4>Головна сторінка</h4>
        <ul>
            <a href="https://rrevura2023-ux.github.io/mt41_iplbrrr/">Цикни на мене!</a>
        </ul>
    </aside>

    <footer>



        <p>&copy; 2026 Всі права захищені</p>
    </footer>
</body>

</html>
