<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 4</title>
    <link rel="stylesheet" href="styles.css">
</head>

<style>
    .Forms {
        margin-bottom: 20px;
    }
</style>

<body>
    <main>
        <header>
            <h1>Мій веб-сайт</h1>
            <section class="Forms">
                <form action="." method="post">
                    <fieldset><legend><label for="name">Ім'я:</label></legend>
                    <input type="text" id="name" name="name">
                   <legend><label for="email">Пошта:</label></legend>
                    <input type="email" id="email" name="email">
                    <legend><label for="password">Пароль:</label></legend>
                    <input type="password" id="password" name="password">
                     <legend><label for="age">Вік:</label>
                    <input type="number" id="age" name="age" min="1" max="120">
                     <legend><label for="birthdate">Дата народження:</label>
                    <input type="date" id="birthdate" name="birthdate">
                    <label><input type="radio" name="gender" value="male"> Чоловік</label>
                    <label><input type="radio" name=">gender" value="female"> Жінка</label>
                     <legend><label for="language">Мова:</label>
                    <select id="language" name="language">
                        <option value="uk">Українська</option>
                        <option value="en">Англійська</option>
                        <option value="de">Німецька</option>
                    </select>
                     <legend><label for="file">Файл:</label></legend>
                    <input type="file" id="file" name="file">
                     <legend><label for="color">Колір:</label></legend>
                    <input type="color" id="color" name="color" value="#000000">
                     <legend><label for="time">Час</label></legend>
                    <input type="time" id="time" name="time"></legend>
                </fieldset>
                </form>
                <button class="height=200" type="submit">Відправити</button>
            </section>
    </main>

    <aside>
        <h4>Головна сторінка</h4>
        <ul>
            <li><a href="https://rrevura2023-ux.github.io/mt41_iplbrrr/">Цикни на мене!</a></li>
        </ul>
    </aside>

    <footer>



        <p>&copy; 2025 Всі права захищені</p>
    </footer>
</body>

</html>
