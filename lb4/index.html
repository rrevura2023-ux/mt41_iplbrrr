<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 4</title>
    <link rel="stylesheet" href="styles.css">
</head>

<style>
    .Forms {
        max-width: 400px;
        column-count: 1;
        gap: 15px;
        flex: 1;

    }

    .Forms,
    input {
        margin-bottom: 10px;
    }
</style>

<body>
    <main>
        <header>
            <h1>STUDENT CARD</h1>
            <h2>Personal Information</h2>
            <section class="Forms">
                <form action="https://rrevura2023-ux.github.io/mt41_iplbrrr/" method="post">
                    <fieldset class="Forms">
                        <legend>Provide your details</legend>
                        <p></p>
                        <label for="name">Ім'я:</label>
                        <input type="text" id="name" name="name">
                        <p></p>
                        <label for="email">Пошта:</label>
                        <input type="email" id="email" name="email">
                        <p></p>
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password">
                        <p></p>
                        <label for="age">Вік:</label>
                        <input type="number" id="age" name="age" min="1" max="120">
                        <p></p>
                        <label for="birthdate">Дата народження:</label>
                        <input type="date" id="birthdate" name="birthdate">
                        <p></p>
                        <label><input type="radio" name="gender" value="male"> Чоловік</label>
                        <label><input type="radio" name=">gender" value="female"> Жінка</label>
                        <p></p>
                        <label for="language">Мова:</label>
                        <select id="language" name="language">
                            <option value="uk">Українська</option>
                            <option value="en">Англійська</option>
                            <option value="de">Німецька</option>
                        </select>
                        <p></p>
                        <label for="country">Країна</label>
                        <select for="country">
                            <option value="uk">Україна</option>
                            <option value="en">Англія</option>
                            <option value="de">Німеччина</option>
                        </select>
                        <p></p>
                    </fieldset>

                <h2>College Subject</h2>
                    <fieldset>
                        <legend>Вибери свій предмет</legend>
                        <label for="country">Предмети на вибір</label>
                        <select for="country">
                            <option value="mate">Математика</option>
                            <option value="uklangueg">Українська мова</option>
                            <option value="english">Англійська</option>
                            <p></p>
                            <label for="range">Rate Interest in Computer Science</label>
                            <input type="range">
                    </fieldset>
                <h2>Your Skill</h2>
                    <fieldset>
                        <legend>Assess your skills</legend>
                        <legend><label for="desc">Опишіт ваші скіли</label></legend>
                        <textarea></textarea>
                        <p></p>
                        <label for="file">Файл:</label>
                        <input type="file" id="file" name="file">
                        <p></p>
                        <label for="color">Колір:</label>
                        <input type="color" id="color" name="color" value="#000000">
                        <p></p>
                        <label for="time">Time</label>
                        <input type="time" id="time" name="time">
                        <p></p>
                        <button type="submit">Відправити</button>
                    </fieldset>
                </form>
            </section>
    </main>

    <aside>
        <h4>Головна сторінка</h4>
        <ul>
            <li><a href="https://rrevura2023-ux.github.io/mt41_iplbrrr/">Цикни на мене!</a></li>
        </ul>
    </aside>

    <footer>



        <p>&copy; 2026 Всі права захищені</p>
    </footer>
</body>

</html>
