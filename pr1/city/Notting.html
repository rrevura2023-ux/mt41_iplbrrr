<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title>Семантична структура</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body,
        h1,
        h2,
        h3,
        p,
        ul,
        li,
        figure,
        figcaption {
            margin: 10px;
            padding: 0;
            list-style: none;
            font-family: 'Arial', sans-serif;
        }

        /* Body and Layout */
        body {
            margin: 0;
            padding: 0;
            line-height: 1.6;
            font-size: 18px;
            color: #0b0b0b;
            animation: opacity 1.2s alternate;
        }

        /* Header */
        header {
            background: #7d7d85;
            color: #000000;
            padding: 20px;
            text-align: center;
            background-image: url(https://www.annees-de-pelerinage.com/wp-content/uploads/2019/09/cinque-terre-italy-travel.jpg);
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
        }    

            mark {
                background: #eea231;
                border-radius: 2px;
                color: #000000;
            }
            
            mark:hover {
             background: #ffdda9;
             animation: markopacity 1s alternate;
            }

            @keyframes markopacity {     
            0% {

            }

            100% {
                transition: 2s;
                opacity: 1;
            }
        }

        header h1 {
            margin: 0 0 10px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdJzNUQfnWzOu_VCj733o5Nor5hZmixge-XgKmIz6-jA&s=10);
            animation: opacity 1.2s alternate;
            border-radius: 5px;
            
        }
        @keyframes opacity {
            0% {
                opacity: 0;
            }

            100% {
                transition: 2s;
                opacity: 1;
            }
        }

        /* Navigation Bar */
        nav ul {
            background: #333;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhtzbzcGuYV9iqsotcYcWz_6RU_e74uLY5XN5cUfEcJRmQunEH-n_KlVk&s=10);
            text-align: center;
            padding: 10px 0;
            border-radius: 5px;
        }

        nav ul li {
            display: inline;
            margin: 0 10px;
        }

        nav ul li a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-weight: bold;
            color: #fff;
        }

        /* Section and Articles */
        section {
            padding: 20px;
            background-image: url(https://img.wallscloud.net/uploads/thumb/2974359326/%D0%A2%D0%B5%D0%BA%D1%81%D1%82%D1%83%D1%80%D0%B0,_%D0%BB%D0%B8%D0%BD%D0%B8%D0%B8,_%D1%81%D0%B5%D1%80%D1%8B%D0%B9,_%D1%84%D0%BE%D0%BD-1024x576-MM-80.webp);
            transition: 2s;
        }
        /* Gallery Section */
        #photo-gallery ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        #photo-gallery li {
            width: calc(33.333% - 20px);
            margin: 10px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #photo-gallery img {
            width: 100%;
            height: auto;
        }

        #photo-gallery figcaption {
            padding: 15px;
            text-align: center;
            font-style: italic;
        }

        /* Form Styles */
        form {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
           text-align: left;
           animation: opacitytitle 1.5s alternate;
           border-radius: 15px;
           background-attachment: fixed;
        }

        form label {
            display: block;
            margin-bottom: 5px;
        }

        form input[type="text"],
        form input[type="email"],
        form textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        form button {
            background: #2d8fd5;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 10px;
            align-items: center;
            
        }
        form h3 {
            background-color: #7ba2ec;
            margin-left: 10px;
            padding: 10px;
            max-width: 130px;
            border-radius: 5px;
        }

        form p {
            background:#eaeaec;
        }
        form button:hover {
            background: #004080;
        }

        /* Footer */
        footer {
            background: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        footer nav ul {
            padding: 0;
            list-style: none;
        }

        footer nav ul li {
            display: inline;
            margin: 0 10px;
        }

        footer nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        footer .social-media a {
            display: inline-block;
            margin: 0 5px;
            color: #fff;
            /* Add additional styles for social media icons if using images or font icons */
        }

        footer p {
            margin: 10px 0;
        }

        footer a {
            color: #fff;
            text-decoration: underline;
            /* Consider removing underline if using buttons for CTA */
        }            

        .Cityselect {
            border-color: #000000;
            background-color: #3d3d49;
            color: #fff;
        }
         
        .link {
            position: relative;
            text-decoration: none;
            font-size: 20px;
            padding-bottom: 4px;
        }

        .link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: #e69e39;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .link:hover::after {
            transform: scaleX(1);
            transform-origin: left;
            background-color: #ff9900;
        }

        aside {
            text-align: center;
            background-image: url(https://i.7fon.org/1000/w685905968.jpg);
            color: azure;
        }
.asideanime {
        animation: asideanime 3s infinite;
}
        @keyframes asideanime {

            0% {
                transform: translateX(10px);
            }

            25% {
                transform: translateX(15px);

            }
        
            100% {
               transform: translateX(10px);

            }
        }

        .asideanime:hover {
         position: relative;

        }
        </style>
</head>

<body>
    <header>
        <h1>Мій веб-сайт</h1>
        <nav>
            <ol>
                <li><a href="#">Головна</a></li>
                <li><a href="#">Про нас</a></li>
                <li><a href="#">Контакти</a></li>
            </ol>
        </nav>
    </header>

    <main>
        <article>
            <h2>Основна стаття</h2>
            <p>Тут розміщується основний контент сторінки.</p>
        </article>
    </main>

    <aside>
        <h2>Останні новини</h2>
        <ul>
            <li><a href="#">Новина 1</a></li>
            <li><a href="#">Новина 2</a></li>
        </ul>
        <form action="." method="post">
         <label for="text">Text</label>
         <input type="text" id="text" name="text" required>
         <button>UUUUUUU</button>
        </form> 
    </aside>
    <footer>

        

        <p>&copy; 2025 Всі права захищені</p>
    </footer>
</body>

</html>
